<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f4">
  <meta name="description" content="A simple, focused to-do list to organise your day.">
  <title>Daylist — To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="./"><span class="brand-icon">✓</span> daylist<span class="brand-period">.</span></a>
      <span class="today" id="today"></span>
    </header>

    <section class="intro">
      <p class="overline">MAKE TODAY COUNT</p>
      <h1>Your day,<br><span>your priorities.</span></h1>
      <p class="subtitle">A little progress each day adds up to big results.</p>
    </section>

    <section class="task-panel" aria-label="Task manager">
      <form class="add-form" id="add-form">
        <label class="sr-only" for="task-input">Add a task</label>
        <span class="plus" aria-hidden="true">+</span>
        <input id="task-input" type="text" maxlength="120" placeholder="What needs to get done?" autocomplete="off" required>
        <button class="add-button" type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <div class="task-summary"><strong id="remaining-count">0</strong> tasks left</div>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">✦</div>
        <h2>Nothing on your list</h2>
        <p>Add a task above and make a start.</p>
      </div>
      <div class="list-footer">
        <span id="completed-count">0 completed</span>
        <button id="clear-completed" class="text-button" type="button">Clear completed</button>
      </div>
    </section>
    <footer>Keep it simple. Keep moving. <span>✳</span></footer>
  </main>

  <dialog class="edit-dialog" id="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2>Edit task</h2>
      <label for="edit-input">Task description</label>
      <input id="edit-input" type="text" maxlength="120" required>
      <div class="dialog-actions">
        <button class="cancel-button" type="button" id="cancel-edit">Cancel</button>
        <button class="save-button" type="submit">Save changes</button>
      </div>
    </form>
  </dialog>
</body>
</html>
